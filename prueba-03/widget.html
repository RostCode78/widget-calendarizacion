<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Widget (prueba)</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: Nunito, "Segoe UI", sans-serif; color: #EEF2F8; overflow: hidden; }
  /* Velo del cristal (sección 4) sobre el desenfoque real de Windows */
  body { background: linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,0) 40%), rgba(30,36,51,.42); box-sizing: border-box; padding: 20px; }
  .hora { font-family: Quicksand, "Segoe UI Light", sans-serif; font-weight: 300; font-size: 64px; }
  .detalle { font-size: 12px; color: #B7C1D3; }
  h2 { font-size: 12px; letter-spacing: .12em; font-weight: 600; color: #B7C1D3; margin: 24px 0 8px; }
  p { font-size: 15px; margin: 6px 0; }
</style>
</head>
<body>
  <div class="hora" id="hora"></div>
  <div class="detalle">Prueba task-03 · widget pegado al escritorio</div>
  <h2>HOY</h2>
  <p>Este texto se debe leer sobre el fondo desenfocado.</p>
  <p>Abre otra ventana: debe quedar encima de esto.</p>
  <p>Pulsa Win+D: este widget debe seguir visible.</p>
<script>
  const t = () => document.getElementById('hora').textContent =
    new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  t(); setInterval(t, 10000);
</script>
</body>
</html>
